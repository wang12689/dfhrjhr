<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编程每日一题算法站</title>
<link rel="stylesheet" href="./css/style.css">
  <script src="https://pl31567211.profitableratecpmnetwork.com/53/86/1c/53861c7869e6f17f71a4fc125a73f975.js"></script>
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <h1 class="logo">💻 每日算法</h1>
    <div class="header-actions">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索题目名称、知识点、关键词...">
        <button id="searchBtn">🔍</button>
      </div>
      <button id="themeToggle" class="theme-btn" title="切换主题">🌙</button>
    </div>
  </div>
  <nav class="nav">
    <div class="container nav-inner">
      <button class="cat-btn active" data-cat="全部">全部</button><button class="cat-btn " data-cat="简单">简单</button><button class="cat-btn " data-cat="中等">中等</button><button class="cat-btn " data-cat="困难">困难</button>
    </div>
  </nav>
</header>

<main class="container main">
  <div class="stats-bar">
    <span id="totalCount">共 0 条内容</span>
    <span id="lastUpdate">最后更新：--</span>
  </div>
  <div id="cardGrid" class="card-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;"><p>😢 没有找到相关内容</p></div>
  <div id="loadingState" class="loading-state"><div class="spinner"></div><p>加载中...</p></div>
</main>

<div id="cardModal" class="modal">
  <div class="modal-mask" data-close="1"></div>
  <div class="modal-content">
    <button class="modal-close" data-close="1">✕</button>
    <div class="modal-tag" id="modalTag"></div>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>
<script src="./js/app.js"></script>
  <script src="https://pl31567212.profitableratecpmnetwork.com/bb/52/14/bb5214bfe53292532a1fddd9f049d033.js"></script>
</body>
</html>
